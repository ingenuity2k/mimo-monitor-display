; MiMo Monitor Display — ESP32 CYD Token Burn Rate Monitor
; Hardware: Cheap Yellow Display ESP32-2432S028R (320x240, ILI9341)
;
; Build:  pio run -e cyd
; Flash:  pio run -e cyd --target upload
; Monitor: pio device monitor -e cyd

[platformio]
default_envs = cyd

[env:cyd]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

board_build.partitions = partitions_cyd.csv
board_build.flash_size = 4MB
board_build.memory_type = dio

build_flags =
    -DCYD=1
    -DDISPLAY_WIDTH=320
    -DDISPLAY_HEIGHT=240
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -Isrc
    -I.

lib_deps =
    lvgl/lvgl@^9.2
    bblanchon/ArduinoJson@^7
    lovyan03/LovyanGFX@^1
